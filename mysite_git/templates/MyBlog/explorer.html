{% extends "MyBlog/base.html" %}
{% load static %}

{% block content %}
<head>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href='https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/leaflet.fullscreen.css' rel='stylesheet' />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src='https://api.mapbox.com/mapbox.js/plugins/leaflet-fullscreen/v1.0.1/Leaflet.fullscreen.min.js'></script>

    <style>
        /* --- 1. RESET DU CONTENEUR PRINCIPAL (Fix Disparition Carte) --- */
        main {
            max-width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
            height: calc(100vh - 70px); /* Indispensable pour voir la carte */
            width: 100vw;
            position: relative;
            overflow: hidden;
        }

        /* --- 2. LA CARTE --- */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background-color: #ddd; /* Gris si ça charge mal */
        }

        /* --- 3. SIDEBAR FLOTTANTE --- */
        .sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            max-height: 90%; 
            overflow-y: auto;
            
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            z-index: 1000;
            font-family: 'Segoe UI', sans-serif;
        }

        .sidebar h3 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.2rem;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        /* --- 4. CONTROLES --- */
        label { font-weight: 600; font-size: 0.9rem; color: #555; display: block; margin-bottom: 5px; }
        
        select {
            width: 100%; padding: 10px; border-radius: 6px; 
            border: 1px solid #ccc; background-color: white; margin-bottom: 10px;
        }

        .btn-clear {
            width: 100%; padding: 8px; background-color: #e74c3c; color: white;
            border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
        }
        .btn-clear:hover { background-color: #c0392b; }
        .btn-clear:disabled { background-color: #ccc; cursor: not-allowed; }

        /* --- 5. SLIDER --- */
        .slider-group {
            background: #f1f2f6; padding: 15px; border-radius: 8px; margin-top: 20px;
        }
        
        .year-display {
            font-size: 1.5rem; color: #27ae60; font-weight: bold; float: right;
        }

        input[type=range] {
            width: 100%; height: 6px; background: #d3d3d3; 
            border-radius: 5px; outline: none; -webkit-appearance: none; margin-top: 10px;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; 
            background: #27ae60; border-radius: 50%; cursor: pointer;
        }

        .toggle-container {
            display: flex; align-items: center; margin-top: 15px; font-size: 0.9rem;
        }
        input[type="checkbox"] { margin-right: 10px; transform: scale(1.2); accent-color: #27ae60; }
    </style>
</head>

<div id="map"></div>

<div class="sidebar">
    <h3>🔭 Observatoire</h3>

    <div style="margin-bottom: 20px;">
        <label for="zoneSelect">Explorer une zone :</label>
        <select id="zoneSelect" onchange="handleZoneChange(this)">
            <option value="" selected disabled>-- Choisir un lieu --</option>
            {% for layer in layers %}
                <option value="{{ layer.id }}">{{ layer.name }}</option>
            {% endfor %}
        </select>
        <button id="clearZoneBtn" class="btn-clear" onclick="clearGeoJSON()" disabled>
            Effacer le tracé
        </button>
    </div>

    <hr style="border:0; border-top:1px solid #ddd;">

    <div class="slider-group">
        <label>Voyage Temporel</label>
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <small>{{ min_year }}</small>
            <span id="currentYear" class="year-display">{{ max_year }}</span>
        </div>
        
        <input type="range" id="yearSlider" 
               min="{{ min_year }}" max="{{ max_year }}" 
               value="{{ max_year }}" step="1">

        <div class="toggle-container">
            <input type="checkbox" id="cumulativeMode" checked>
            <label for="cumulativeMode" style="margin:0; cursor:pointer;">Mode Historique (Cumulatif)</label>
        </div>
    </div>
    
    <div style="margin-top: 20px; font-size: 0.8rem; color: #888; text-align: center;">
        <i>Utilisez le bouton carré sur la carte pour le plein écran.</i>
    </div>
</div>

<script>
    // 1. CARTE
    var map = L.map('map', { fullscreenControl: true }).setView([20, 0], 2); 

    // 2. FONDS DE CARTE
    var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' });
    var satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri' });
    var dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CartoDB' });

    osm.addTo(map); // Par défaut

    var baseMaps = { "Plan Classique": osm, "Satellite": satellite, "Mode Sombre": dark };
    L.control.layers(baseMaps).addTo(map);

    var sticksLayer = L.layerGroup().addTo(map);
    var zoneLayer = L.geoJSON().addTo(map);

    // 3. FONCTIONS LOGIQUES
    function handleZoneChange(selectElement) {
        var id = selectElement.value;
        if (!id) return;
        document.getElementById('clearZoneBtn').disabled = false;

        fetch(`/MyBlog/api/layer/${id}/`)
            .then(res => res.json())
            .then(data => {
                fetch(data.url)
                    .then(r => r.json())
                    .then(geojsonData => {
                        zoneLayer.clearLayers();
                        zoneLayer.addData(geojsonData);
                        zoneLayer.setStyle({ color: "#e74c3c", weight: 3, fillColor: "#e74c3c", fillOpacity: 0.2 });
                        map.fitBounds(zoneLayer.getBounds());
                    });
            });
    }

    function clearGeoJSON() {
        zoneLayer.clearLayers();
        document.getElementById('zoneSelect').value = ""; 
        document.getElementById('clearZoneBtn').disabled = true; 
        map.setView([20, 0], 2);
    }

    // --- FONCTION PRINCIPALE AVEC LE LIKE ---
    function updateSticks() {
        var year = document.getElementById('yearSlider').value;
        var isCumulative = document.getElementById('cumulativeMode').checked;
        document.getElementById('currentYear').textContent = year;

        fetch(`/MyBlog/api/sticks/?year=${year}&cumulative=${isCumulative}`)
            .then(response => response.json())
            .then(data => {
                sticksLayer.clearLayers();
                data.sticks.forEach(stick => {
                    if(stick.lat && stick.lon) {
                        
                        // POPUP AVEC LE BOUTON ❤️
                        var popup = `
                            <div style="text-align:center">
                                <h4 style="margin:0">${stick.title}</h4>
                                <span style="color:#666">📅 ${stick.year}</span><br>
                                
                                <button onclick="addLike(${stick.id})" style="
                                    background: #f8f9fa; 
                                    color: #333; 
                                    border: 1px solid #ddd; 
                                    padding: 6px 15px; 
                                    border-radius: 20px; 
                                    cursor: pointer; 
                                    margin: 8px 0; 
                                    font-weight: 600; 
                                    font-size: 0.9em;
                                    display: flex;
                                    align-items: center;
                                    gap: 5px;
                                    justify-content: center;
                                    width: 100%;
                                    transition: all 0.2s;">
                                    <span style="color: #e74c3c;">❤️</span> 
                                    <span id="likes-count-${stick.id}" style="color: #2c3e50;">${stick.likes}</span>
                                </button>
                            </div>
                            <a href="${stick.url}" target="_blank" style="display:block; margin-top:5px; text-align:center;">Voir la fiche</a>
                        `;

                        if(stick.image_url) {
                            popup = `<img src="${stick.image_url}" style="width:100%; border-radius:4px; margin-bottom:5px;">` + popup;
                        }

                        L.marker([stick.lat, stick.lon]).bindPopup(popup).addTo(sticksLayer);
                    }
                });
            })
            .catch(err => console.error("Erreur Fetch Sticks:", err));
    }

    // --- FONCTION POUR AJOUTER UN LIKE (AJAX) ---
    function addLike(id) {
        fetch(`/MyBlog/api/like/${id}/`, { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                // Mise à jour visuelle immédiate
                var span = document.getElementById(`likes-count-${id}`);
                if(span) {
                    span.textContent = data.new_count;
                }
            })
            .catch(err => console.error("Erreur Like:", err));
    }

    // 4. EVENTS
    document.getElementById('yearSlider').addEventListener('input', updateSticks);
    document.getElementById('cumulativeMode').addEventListener('change', updateSticks);
    
    // Démarrage
    updateSticks();

</script>
{% endblock %}
